name: Deploy landing page

# The site has no application build step. Verify the shared design and
# interactive dashboard before uploading the static directory to Pages.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "playwright.config.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy in flight: a half-published site is worse than a stale
# one, so queued runs wait their turn instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify shared design integrity
        run: node site/scripts/sync-design.mjs --check

      - name: Test dashboard state and storage
        run: node --test tests/dashboard.test.mjs

      - name: Install browser for interaction checks
        run: pnpm exec playwright install chromium --with-deps

      - name: Test desktop and mobile dashboard interactions
        run: pnpm test:e2e

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
